modLoader = "javafml"
loaderVersion = "${loader_version}"
license = "LGPLv3"
issueTrackerURL = "https://github.com/WildfireRomeo/WildfireFemaleGenderMod/issues"

[[mods]]
    modId = "wildfire_gender"
    version = "${file.jarVersion}"
    displayName = "Female Gender Mod"
    #updateJSONURL="https://change.me.example.invalid/updates.json"
    displayURL = "https://www.curseforge.com/minecraft/mc-mods/female-gender-neoforge"
    logoFile = "logo.png"
    credits = "A2 76, Arcti_cc, BluelightAmelia, celeste, diademiemi, IzzyBizzy45, Kichura, PinguinLars, Powerless001, pupnewfster, RacoonDog"
    authors = "WildfireRomeo"
    description = "Adds extra customization options to the player model by adding breasts for a more feminine appearance."
    displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.wildfire_gender]]
    modId = "minecraft"
    type = "required"
    versionRange = "${mc_version}"
    side = "BOTH"
[[dependencies.wildfire_gender]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version}"
    side = "BOTH"