name: Build Fabric mod with Gradle
on: [pull_request, push]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      with:
        persist-credentials: false
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # 5.0.0
      with:
        cache-disabled: true
    - name: Extract build version information
      id: ref
      run: .github/extract_refs.sh
    - name: Set up JDK 25
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # 5.2.0
      with:
        distribution: 'temurin'
        java-version: 25
        check-latest: true
    - name: Validate JSON files
      run: python3 .github/validate_json.py
    - name: Build with Gradle
      run: ./gradlew build
    - name: Upload compiled artifacts
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # 6.0.0
      with:
        name: WFGM-artifacts-${{ steps.ref.outputs.branch }}
        path: build/libs/*.jar
        if-no-files-found: error
